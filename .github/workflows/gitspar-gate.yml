name: GitSpar Verification Gatekeeper

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verified Change Understanding Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GitSpar CI Check
        run: npx tsx src/cli.ts --ci

      - name: Post or Update PR Receipt Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const receiptPath = '.gitspar/PR_RECEIPT.md';

            if (!fs.existsSync(receiptPath)) {
              console.log('No PR receipt found to post.');
              return;
            }

            const receiptContent = fs.readFileSync(receiptPath, 'utf8');
            const commentHeader = '<!-- gitspar-verification-receipt -->';
            const body = `${commentHeader}\n${receiptContent}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body && comment.body.includes(commentHeader)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
              console.log(`Updated existing GitSpar receipt comment (${botComment.id}).`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Created new GitSpar receipt comment.');
            }
